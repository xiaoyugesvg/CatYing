name: Build iOS TrollStore IPA (Flutter + NodeMobile + CPython)

# 触发：
#   - push to main / tag: 自动构建（带路径过滤，见下）
#   - workflow_dispatch: 手动触发（**不受路径过滤影响**，需要强制构建时用这个）
#
# 路径过滤（省 macOS 额度）：macOS runner 按 **10 倍**扣分钟数，一次构建 ≈50 额度分钟，
#   而改个 README 完全不影响 IPA ⇒ 纯文档改动不该触发构建。
#   ⚠️ 用 paths-ignore 而不是 paths：它的语义是**兜底安全**的 ——
#      只有当本次改动的**所有**文件都命中忽略清单时才跳过；只要有一个文件没命中就跑。
#      换成 paths 白名单的话，将来新增的代码目录一旦忘了登记，就会静默不构建（更糟）。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Empty = only upload to Actions artifacts"
        required: false
        default: ""

# 避免同一个 ref 跑多次（pod install 慢，浪费时间 + macOS 分钟数）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-trollstore:
    name: Build Runner.app + NodeMobile + ldid → IPA
    # macos-14 已弃用（2026-11-02 下线）；macos-15-intel（x64）能跑但 Xcode 编译
    # 明显更慢（实测 16 分钟还没编完）。这里用 **macos-15（arm64）**：
    #   · 受支持的标准镜像，容量充足
    #   · 之前成功的 macos-14 其实也是 arm64，Xcode 编译只要 4~5 分钟
    runs-on: macos-15
    # 正常一次构建 ≈7 分钟（实测：SPM 解析 2.6 + iOS 构建 2.1，其余步骤全在秒级）。
    # 原来写 90 ⇒ 一旦某步卡死（网络下载 / 编译挂住）最坏烧掉 90×10 = 900 额度分钟。
    # 收到 45 仍留 6 倍余量（冷缓存首次 pod install 最慢也就是 9 分钟量级）。
    timeout-minutes: 45
    permissions:
      contents: write

    env:
      # iOS 用的是「NodeMobile.xcframework」嵌入方案（参考 D:\gz\tvbox-Swift-main）
      # 不能像 Windows/Android 那样用 .node.exe —— iOS 沙盒拒绝任意可执行文件
      # NodeMobile 把 Node.js 引擎编译成 iOS framework，主 app 通过 ObjC 接口调
      #
      # fogtape/nodejs-mobile 自建流水线（拉官方 nodejs/node 源码 + 移动端补丁）
      # 官方 nodejs-mobile 停在 v18 不再更新；这里是社区续命的 Node 24 LTS 线。
      # full 版（含完整 ICU / Inspector），lite 版是给 danmu_api 定制的精简版。
      # 包内结构与官方完全一致：NodeMobile.xcframework/{ios-arm64, ios-arm64-simulator}
      # + Headers/NodeMobile.h（导出 node_start），可直接替换。
      NODEJS_MOBILE_VERSION: "v24.22.1-0"
      NODEJS_MOBILE_URL: "https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/nodejs-mobile-ios-24.22.1-0.zip"
      # BeeWare Python-Apple-support 官方 release（Python.xcframework）
      PYTHON_IOS_VERSION: "3.12-b11"
      PYTHON_IOS_URL: "https://github.com/beeware/Python-Apple-support/releases/download/3.12-b11/Python-3.12-iOS-support.b11.tar.gz"
      BUNDLE_NAME: Runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter (stable)
        # 网络步骤：卡住会一直等到 job 超时才收手（实测 0.4 分钟）
        timeout-minutes: 10
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # macos-15 是 Apple Silicon；显式要 arm64 的 Flutter SDK，
          # 避免默认下 x64 版走 Rosetta（编译会明显变慢）
          # ⚠️ 不要传 `flutter-version-file: pubspec.yaml`：
          #   pubspec 里的 `environment.sdk: '>=3.12.0'` 是 Dart SDK 范围约束，
          #   flutter-action 解析后会找 Flutter SDK `3.12.0`，但 stable channel 没有这个具体版本号
          #   → 报错 "Unable to determine Flutter version for channel: stable"
          # 正确做法：在 pubspec.yaml 加 `flutter: '>=3.22.0'`（用 stable 匹配的版本）
          # 然后改用 `flutter-version-file: pubspec.yaml` + `channel: stable`
          #
          # 注意：macos-15 runner 是 Apple Silicon (arm64)
          # 显式传 architecture: arm64，下载原生 SDK（不传默认 x64，会走 Rosetta）
          architecture: arm64

      - name: Show Flutter / Xcode versions
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Install ldid
        # Saurik 的 ldid 工具，做 ad-hoc 伪签名（TrollStore 接受）
        run: brew install ldid

      - name: Install Node.js for build scripts
        # Flutter stable 偶尔会带 node，但显式装一个 LTS 保证 npm install 跑得动
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'assets/nodejs-project/package-lock.json'

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Flutter pub get
        # 网络步骤（实测 0.2 分钟）
        timeout-minutes: 10
        run: flutter pub get

      - name: Resolve SPM packages (KSPlayer = 已打补丁的 fork)
        # KSPlayer 已改为指向 **xiaoyugesvg/KSPlayer 的 `newtv-patched` 分支**
        # （public 仓库；pbxproj 里 revision 固定为 f016106，源码内直接含 guard1~6）
        # ⇒ 不再需要构建期打补丁，也就没有「补丁打到 A 目录、编译用 B 目录」的漂移
        #   问题（这正是之前"补丁打不进去"的根因：patch_ksplayer.sh 打在默认
        #   DerivedData，而 flutter build ios 用 <项目>/build/ios 的检出编译）。
        # 这里保留 resolve 只为预热检出，并显式校验 pin 的就是那个打过补丁的提交。
        # 网络步骤：拉 SPM 依赖是最容易卡住的一步（实测 2.6 分钟，是全流程最慢的）
        timeout-minutes: 20
        run: |
          set -e
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace -scheme Runner
          PBX=ios/Runner.xcodeproj/project.pbxproj
          grep -q 'xiaoyugesvg/KSPlayer' "$PBX" \
            || { echo "❌ KSPlayer 未指向打过补丁的 fork"; exit 1; }
          grep -q 'f016106441c0c9abaa0517c0507778a49a68227f' "$PBX" \
            || { echo "❌ KSPlayer revision 不是打过补丁的提交"; exit 1; }
          echo "✅ KSPlayer pin = fork newtv-patched（源码已含 guard1~6）"

      - name: Static analysis (errors only)
        # 只把 error 当失败：仓库既有 500+ 条 info 级 lint（风格），不应阻塞构建。
        # 放在 Xcode 构建之前，几秒内就能拦住「类型错误」这类会浪费 25 分钟
        # iOS 构建的问题（例：漏 import 'dart:async' 导致 Timer 未定义）。
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build Node.js project (main.js)
        # 参考 D:\gz\tvbox-Swift-main 的 build-ios.sh
        # 编译 assets/nodejs-project/src/* → dist/main.js + dist/main.js.md5
        # 编译后必须存在 dist/main.js，否则 iOS 端 NodeMobile 启动时会闪退
        run: |
          set -e
          cd assets/nodejs-project
          echo "=== npm install ==="
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          echo "=== esbuild main.js ==="
          if [ -f "esbuild.js" ]; then
            node esbuild.js
          elif [ -f "build-ios.sh" ]; then
            bash build-ios.sh
          else
            echo "❌ no esbuild.js or build-ios.sh found"
            exit 1
          fi
          if [ ! -f "dist/main.js" ]; then
            echo "❌ dist/main.js not produced"
            exit 1
          fi
          echo "=== dist/ ==="
          ls -lh dist/
          echo "=== main.js md5 ==="
          md5 dist/main.js > dist/main.js.md5
          cat dist/main.js.md5

      - name: Download NodeMobile.xcframework
        # 网络步骤：从 GitHub Release 下载，实测 ~2 秒，但慢时可能到分钟级
        timeout-minutes: 15
        # 参考 build_trollstore.yml 的同款步骤
        # NodeMobile 是 nodejs-mobile 项目发布的 iOS framework
        # 它是 iOS 端 Node.js 运行时的**唯一合法**运行方式
        run: |
          set -e
          echo "=== Downloading NodeMobile.xcframework ==="
          mkdir -p build/ios/Frameworks
          cd build/ios/Frameworks
          if [ -d "NodeMobile.xcframework" ]; then
            rm -rf NodeMobile.xcframework
          fi
          curl -fSL "$NODEJS_MOBILE_URL" -o nodejs-mobile.zip
          TEMP_DIR=$(mktemp -d)
          unzip -q nodejs-mobile.zip -d "$TEMP_DIR"
          FRAMEWORK_PATH=$(find "$TEMP_DIR" -name "NodeMobile.xcframework" -type d | head -1)
          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "❌ NodeMobile.xcframework not found in archive"
            exit 1
          fi
          cp -R "$FRAMEWORK_PATH" .
          rm -rf "$TEMP_DIR" nodejs-mobile.zip
          echo "=== NodeMobile.xcframework slices ==="
          ls NodeMobile.xcframework/
          echo "✅ NodeMobile.xcframework ready"

      - name: Download Python.xcframework
        # 网络步骤：从 GitHub Release 下载，实测 ~3 秒，但慢时可能到分钟级
        timeout-minutes: 15
        # BeeWare Python-Apple-support 的 iOS 支持包（CPython 3.12）
        # 包内含 Python.xcframework（ios-arm64 + ios-arm64_x86_64-simulator 双 slice）
        # 这是 iOS 端 CPython 嵌入的运行时来源（T3 Python spider 源引擎）
        run: |
          set -e
          echo "=== Downloading Python.xcframework ($PYTHON_IOS_VERSION) ==="
          mkdir -p build/ios/Frameworks
          cd build/ios/Frameworks
          if [ -d "Python.xcframework" ]; then
            rm -rf Python.xcframework
          fi
          curl -fSL "$PYTHON_IOS_URL" -o python-ios-support.tar.gz
          TEMP_DIR=$(mktemp -d)
          tar -xzf python-ios-support.tar.gz -C "$TEMP_DIR"
          FRAMEWORK_PATH=$(find "$TEMP_DIR" -name "Python.xcframework" -type d | head -1)
          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "❌ Python.xcframework not found in archive"
            exit 1
          fi
          cp -R "$FRAMEWORK_PATH" .
          rm -rf "$TEMP_DIR" python-ios-support.tar.gz
          echo "=== Python.xcframework slices ==="
          ls Python.xcframework/
          # ── 🔴 让 Swift 能 `import Python`（CI 实测报错：PythonBridge.swift:24
          #    "No such module 'Python'"）──────────────────────────────
          # BeeWare 的 Python.framework 里 module map 只放在 **Headers/** 下：
          #     Python.framework/{Python, Headers/module.modulemap, Info.plist}
          # 而 Swift 解析 `import Python` 时只在
          #     Python.framework/**Modules**/module.modulemap
          # 里找模块 ⇒ 必然 No such module（与框架是否 link、是否 embed 无关，
          # 所以 pbxproj 校验全绿也照样编译失败）。
          # 修法：为每个 slice 补出 Modules/module.modulemap，并把声明改成
          # `framework module`（框架目录下的 module map 必须是 framework module）。
          for FW in Python.xcframework/*/Python.framework; do
            [ -d "$FW" ] || continue
            mkdir -p "$FW/Modules"
            sed '1s/^module Python {/framework module Python {/' \
              "$FW/Headers/module.modulemap" > "$FW/Modules/module.modulemap"
            grep -q '^framework module Python {' "$FW/Modules/module.modulemap" \
              || { echo "❌ module map 改写失败: $FW"; exit 1; }
            echo "✅ 已补 $(dirname "$FW" | xargs basename)/Python.framework/Modules/module.modulemap"
          done
          head -3 Python.xcframework/ios-arm64/Python.framework/Modules/module.modulemap
          echo "✅ Python.xcframework ready"

      - name: Copy NodeMobile.xcframework to ios/Frameworks
        # 关键：xcframework 必须放在项目内（ios/Frameworks/），pbxproj 才能用
        # 短路径 `Frameworks/NodeMobile.xcframework`。
        # 放项目外（build/ios/Frameworks/）时 pbxproj 需要 `../../build/...` 相对路径，
        # 在不同 Xcode 解析 base 下会出 bug。
        run: |
          set -e
          mkdir -p ios/Frameworks
          rm -rf ios/Frameworks/NodeMobile.xcframework
          cp -R build/ios/Frameworks/NodeMobile.xcframework ios/Frameworks/
          echo "=== ios/Frameworks ==="
          ls ios/Frameworks/
          ls ios/Frameworks/NodeMobile.xcframework/

      - name: Copy Python.xcframework to ios/Frameworks
        # 与 NodeMobile 同一策略：Python.xcframework 必须放在项目内，
        # pbxproj 用短路径 `Frameworks/Python.xcframework`。
        run: |
          set -e
          mkdir -p ios/Frameworks
          rm -rf ios/Frameworks/Python.xcframework
          cp -R build/ios/Frameworks/Python.xcframework ios/Frameworks/
          echo "=== ios/Frameworks/Python.xcframework ==="
          ls ios/Frameworks/Python.xcframework/

      - name: Build python-home (stdlib + site-packages + 适配层)
        # T3 Python spider 源引擎的运行时目录，最终 embed 到 Runner.app/python-home：
        #   python-home/
        #   ├── lib/python3.12/                     ← stdlib（来自 Python.xcframework）
        #   ├── lib/python3.12/site-packages/       ← pip --target 的纯 Python 库
        #   ├── spider_runner.py                    ← 适配层标准入口
        #   ├── src/spider/{video,book}/            ← 源脚本
        #   └── pylib/
        # 纯 Python 库（requests / httpx / beautifulsoup4 / flask 及其依赖均无必须的
        # C 扩展，跨平台 OK）；lxml / pycryptodome 的真库是 C 扩展（iOS 交叉编译不可行），
        # 由 pylib/ 下的纯 Python 垫片提供同名 API（见 assets/python-project/pylib/）。
        run: |
          set -e
          echo "=== 构建 python-home ==="
          # ── 🔴 stdlib 与 C 扩展在**两个不同目录**（实测 xcframework 内容）──
          #   Python.xcframework/lib/python3.12/                      ← 纯 Python 标准库
          #       （含 encodings/ —— Py_Initialize 阶段**必须**能找到它）
          #   Python.xcframework/<slice>/lib-arm64/python3.12/lib-dynload/  ← C 扩展 .so
          # ❗原实现只拷了后者（`-path "*ios-arm64/lib-arm64/python3.12"`）⇒
          #   python-home/lib/python3.12 里只有 lib-dynload、**没有 encodings**
          #   ⇒ Py_Initialize 直接 "Fatal Python error: init_fs_encoding..." →
          #     Py_ExitStatusException → exit(1)，进程当场死、Swift 侧拦不住
          #     （崩溃报告 Runner-2026-10-13-180034.ips：栈顶就是 Py_InitializeEx，
          #      随后在退出流程的 C++ finalizer 里二次崩 EXC_BAD_ACCESS 0x60）。
          XCF=build/ios/Frameworks/Python.xcframework
          STDLIB_SRC=""
          for d in "$XCF/lib/python3.12" "$XCF"/ios-arm64/lib-arm64/python3.12; do
            if [ -f "$d/encodings/__init__.py" ]; then STDLIB_SRC="$d"; break; fi
          done
          if [ -z "$STDLIB_SRC" ]; then
            echo "❌ 找不到含 encodings 的 stdlib（纯 Python 标准库应在 $XCF/lib/python3.12）"
            echo "=== xcframework 顶层 ==="
            ls "$XCF"
            exit 1
          fi
          echo "stdlib(纯 Python) ← $STDLIB_SRC"
          mkdir -p build/python-home/lib/python3.12
          cp -R "$STDLIB_SRC/." build/python-home/lib/python3.12/
          # C 扩展：CPython 默认在 $PYTHONHOME/lib/python3.12/lib-dynload 找 .so
          #  🔴 必须取 **ios-arm64（真机）** 那一份。xcframework 里 device 与
          #     simulator **各有一份** lib-dynload，且 .so 名字不同：
          #       真机   : math.cpython-312-iphoneos.so
          #       模拟器 : math.cpython-312-iphonesimulator.so
          #     旧实现 `find … | head -1` 顺序不定，可能拷到 simulator 那份 ⇒
          #     真机上 `import math` 找不到 iphoneos 后缀的 .so ⇒
          #       ModuleNotFoundError: No module named 'math'
          #     而 .py 源注册（install_source）内部会 exec 脚本代码（脚本 import math
          #     等标准库 C 扩展），注册当场失败 → 后续调用再 import 该模块就报
          #       ModuleNotFoundError: No module named 'src.spider.video.psrc_…'
          #     （用户 2026-10-13 连续报的这两条，其实是同一个根因）。
          #     判据：目录里**必须存在 iphoneos 后缀的 math.so**。
          DYNL_SRC=""
          for d in "$XCF"/ios-arm64/lib-arm64/python3.12/lib-dynload \
                   "$XCF"/*/lib-arm64/python3.12/lib-dynload; do
            if [ -f "$d/math.cpython-312-iphoneos.so" ]; then DYNL_SRC="$d"; break; fi
          done
          if [ -z "$DYNL_SRC" ]; then
            echo "❌ 找不到真机 lib-dynload（缺 math.cpython-312-iphoneos.so）"
            ls "$XCF" || true
            find "$XCF" -name "math.*.so" 2>/dev/null || true
            exit 1
          fi
          echo "lib-dynload(真机) ← $DYNL_SRC"
          mkdir -p build/python-home/lib/python3.12/lib-dynload
          cp -R "$DYNL_SRC/." build/python-home/lib/python3.12/lib-dynload/
          # 硬自检：真机缺少 C 扩展 ⇒ 所有 .py 源注册必失败，这里先拦住
          test -f build/python-home/lib/python3.12/lib-dynload/math.cpython-312-iphoneos.so \
            || { echo "❌ python-home 里缺 math.cpython-312-iphoneos.so"; exit 1; }
          # 硬自检：没有 encodings 就一定会在 Py_Initialize 崩，这里先拦住
          test -f build/python-home/lib/python3.12/encodings/__init__.py \
            || { echo "❌ python-home 里缺 encodings/__init__.py"; exit 1; }
          echo "=== stdlib 就绪 ==="
          ls build/python-home/lib/python3.12 | head -20
          echo "=== lib-dynload 就绪（前 10 个 .so）==="
          ls build/python-home/lib/python3.12/lib-dynload | head -10
          echo "=== pip install 常用库 (--target site-packages) ==="
          mkdir -p build/python-home/lib/python3.12/site-packages
          python3 -m pip install --quiet --target build/python-home/lib/python3.12/site-packages \
            requests httpx beautifulsoup4 flask
          echo "=== site-packages 就绪 ==="
          ls build/python-home/lib/python3.12/site-packages | head -20
          # 清掉 pip 装进来的**宿主平台** C 扩展（macOS .so / Windows .pyd）：
          # iOS 加载不了它们，而且 import 时会**先命中扩展再报错**（不会自动回退到 .py）。
          # 这几个包都带纯 Python 回退：markupsafe/_native.py、
          # charset_normalizer/cd.py + md.py ⇒ 删掉后 import 才走回退。
          echo "=== 清理宿主平台 C 扩展 ==="
          find build/python-home/lib/python3.12/site-packages \
            \( -name "*.so" -o -name "*.pyd" \) -print -delete || true
          echo "=== 合并适配层 (spider_runner.py + src/ + pylib/) ==="
          cp -R assets/python-project/. build/python-home/
          ls build/python-home/
          echo "=== 常用库导入自检（含 lxml/pycryptodome 纯 Python 垫片）==="
          PYTHONPATH="build/python-home/lib/python3.12/site-packages:build/python-home/pylib" \
            python3 -c "import requests, httpx, bs4, flask; from lxml import etree; from Crypto.Cipher import AES; from pyquery import PyQuery; print('✅ requests/httpx/bs4/flask/lxml/Crypto/pyquery 导入 OK')"
          echo "✅ python-home ready"

      - name: Install ruby + xcodeproj gem
        # 网络步骤：gem install 走 rubygems，卡住会干等到 job 超时（实测 1 秒）
        timeout-minutes: 10
        # macos-15-intel runner 自带 ruby，需要 xcodeproj gem 来自动改 project.pbxproj
        run: |
          ruby --version
          gem install xcodeproj --no-document

      - name: Patch project.pbxproj (link NodeMobile + add NodeJSBridge.swift)
        # 自动改 Runner.xcodeproj/project.pbxproj：
        #   - 加 NodeJSBridge.swift 到 Runner group + Sources build phase
        #   - link NodeMobile.xcframework 到 Frameworks build phase
        #   - embed NodeMobile.xcframework 到 Embed Frameworks
        # `--xcframework` 用相对 ios/ 的短路径（xcframework 已经被上面 copy 过来）
        #
        # ⚠️ 这个列表是**权威来源**：脚本只会把列在这里的文件加进 target。
        #    新增 Runner 原生文件必须同步加到这里，否则 CI 编不到它 →
        #    引用它的代码报 "cannot find X in scope" → 整个 iOS 构建失败。
        #    （TtsEngine.swift 曾经只靠本地手动登记 pbxproj 生效，就是这个坑）
        #
        # 注意：脚本内部固定把文件标成 `sourcecode.swift`（add_nodemobile.rb L108），
        #      所以**只能放 .swift**。Objective-C 文件（如 ExceptionGuard.m）不要加，
        #      否则会被当成 Swift 编译。ObjC 文件请在 pbxproj 里手动登记。
        run: |
          set -e
          cd ios
          ruby scripts/add_nodemobile.rb \
            --xcframework Frameworks/NodeMobile.xcframework \
            --extra-swift NodeJSBridge.swift,BackgroundAudio.swift,PipManager.swift,AvEngine.swift,AvPlayerViewFactory.swift,TtsEngine.swift
          # Python.xcframework + PythonBridge.swift：第二次调用 add_nodemobile.rb
          # （脚本幂等，只处理自己列的文件；PythonBridge.swift 不重复进 Node 列表）
          ruby scripts/add_nodemobile.rb \
            --xcframework Frameworks/Python.xcframework \
            --extra-swift PythonBridge.swift
          echo "=== pbxproj 改动 diff ==="
          git diff --stat Runner.xcodeproj/project.pbxproj || true

      - name: Verify native sources are in the target
        # 兜底自检：上面任何一步漏了文件，在这里就失败（几秒），
        # 而不是等到 Xcode 编译到一半才报 "cannot find in scope"。
        run: |
          set -e
          PBX=ios/Runner.xcodeproj/project.pbxproj
          MISSING=0
          # 全部手写 Swift 源都要在 target 里。
          # 早期只查了 TtsEngine/BackgroundAudio —— NodeJSBridge/PipManager/
          # AvEngine/AvPlayerViewFactory 漏了没查，将来谁改名或漏登记都发现不了。
          # KSEngine.swift（KSPlayer 第四核心）是直接手动登记进 pbxproj 的，
          # 不走上面 add_nodemobile.rb 的 --extra-swift，同样纳入兜底校验。
          for F in TtsEngine.swift ExceptionGuard.m BackgroundAudio.swift AppDelegate.swift \
                   NodeJSBridge.swift PipManager.swift AvEngine.swift AvPlayerViewFactory.swift \
                   KSEngine.swift PythonBridge.swift; do
            if grep -q "$F in Sources" "$PBX"; then
              echo "✅ $F 已在 Sources build phase"
            else
              echo "❌ $F 不在 Sources build phase —— 构建必失败"
              MISSING=1
            fi
          done
          # KSPlayer 是 SPM 包依赖（XCRemoteSwiftPackageReference 固定 revision），
          # 只有 productRef 没有 fileRef —— 丢了会报 "No such module 'KSPlayer'"
          if grep -q "KSPlayer in Frameworks" "$PBX"; then
            echo "✅ KSPlayer SPM 依赖已在 Frameworks build phase"
          else
            echo "❌ KSPlayer in Frameworks 丢失 —— Xcode 编译报 No such module 'KSPlayer'"
            MISSING=1
          fi
          # Python.xcframework 由 add_nodemobile.rb 二次调用 link + embed
          if grep -q "Python.xcframework in Frameworks" "$PBX"; then
            echo "✅ Python.xcframework 已在 Frameworks build phase"
          else
            echo "❌ Python.xcframework in Frameworks 丢失 —— Xcode 编译报 No such module 'Python'"
            MISSING=1
          fi
          for F in ExceptionGuard.h; do
            if grep -q "$F" "$PBX"; then
              echo "✅ $F 已登记"
            else
              echo "❌ $F 未登记"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "=== Sources 里实际有什么 ==="
            grep "in Sources" "$PBX" | sed 's/^/  /'
            exit 1
          fi

      - name: Disable Swift Package Manager
        # media_kit_libs_ios_video / media_kit_video 不支持 Swift Package Manager。
        # Flutter 3.44 起 SPM 默认接管 iOS 依赖，media_kit 会触发硬错误导致构建失败。
        # 正确禁用方式是 flutter config（不是 build 的 flag）：
        #   flutter config --no-enable-swift-package-manager
        # 项目级配置已同时写在 pubspec.yaml（flutter.config.enable-swift-package-manager=false），
        # 这里再跑一次全局兜底。
        run: |
          flutter config --no-enable-swift-package-manager

      - name: Build iOS (no codesign)
        # 实测 2.1 分钟；冷缓存首次要跑 pod install，最慢见过 5~6 分钟 ⇒ 留足余量
        timeout-minutes: 30
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      - name: Verify CocoaPods plugin registration
        # ── 为什么需要这一步 ────────────────────────────────────────
        # 曾经的坑：flutter_tts 加进 pubspec 但原生库没被链接，
        # App 装完直接 SIGABRT 闪退，而**构建阶段完全看不出问题**。
        #
        # 时机：故意放在 `flutter build ios` **之后** ——
        # Pods/Manifest.lock 是 pod install 生成的，放前面等于没查。
        #
        # ── 判据的演进（我踩了两次坑，记下来免重蹈）─────────────────
        # 第一版：把 `.flutter-plugins-dependencies` 里 ios 键下的所有名字拿去比对
        #   → 满屏假警告。因为那个键里混着**各平台实现**
        #   （android_file_picker / file_selector_macos / permission_handler_html …），
        #   它们本来就不该出现在 iOS Pods 里。构建被这些假警报卡死。
        # 第二版：按后缀排除 → 仍会误判（后缀不齐、darwin 目录等）。
        # 现在：**目标收窄到"必须存在"的那批插件**（造成过闪退或功能静默失效的），
        #   逐个用 pod 名去 Pods/Manifest.lock 里找。
        #   pod 名 == podspec 名 == 插件包名（已核对 bonsoir_darwin / file_picker_darwin /
        #   sqflite_darwin / webview_flutter_wkwebview 的 podspec 在 darwin/ 下，
        #   s.name 仍是包名本身），所以 grep 包名即可，不需要解析段落结构。
        run: |
          set -e
          MANIFEST=ios/Pods/Manifest.lock
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ $MANIFEST 不存在 —— pod install 没跑，插件不会被链接，装上必闪退"
            exit 1
          fi

          COUNT=$(grep -cE '^  - ' "$MANIFEST" || true)
          echo "=== Pods/Manifest.lock 里登记了 $COUNT 个 pod ==="

          echo ""
          echo "=== 关键原生插件硬校验 ==="
          MISSING=0
          for P in bonsoir_darwin file_picker_darwin flutter_pdfview permission_handler_apple \
                   sqflite_darwin url_launcher_ios webview_flutter_wkwebview \
                   media_kit_video media_kit_libs_ios_video video_player_avfoundation \
                   quickjs_engine; do
            if grep -qE "^  - $P " "$MANIFEST"; then
              echo "  ✅ $P"
            else
              echo "  ❌ $P 未接入 Pods —— 运行时 MissingPluginException 或闪退"
              MISSING=1
            fi
          done

          if [ "$MISSING" = "1" ]; then
            echo ""
            echo "=== Manifest.lock 的 PODS 段（前 80 行）==="
            sed -n '/^PODS:/,/^DEPENDENCIES:/p' "$MANIFEST" | head -80 | sed 's/^/  /'
            exit 1
          fi
          echo ""
          echo "✅ 关键插件全部已接入 iOS（pod install 正常，原生库已链接）"

      - name: Locate Runner.app
        id: locate
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -maxdepth 2 -name "${BUNDLE_NAME}.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app not found"
            find build/ios -name "*.app" -type d || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "📦 App bundle: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Verify QuickJS native bridge symbols
        # quickjs_engine 的 Dart FFI 用 dlsym(RTLD_DEFAULT) 查 C 符号：
        # 插件没被 pod install 接入、或符号被 dead-strip，运行时就报
        # `Failed to lookup symbol 'jsNewRuntime'`（Venera / 书源 JS 全部失效）。
        # 实测根因：quickjs_engine 只写在 dependency_overrides 里 ⇒ Flutter 不认插件。
        run: |
          set -e
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          FOUND=""
          for BIN in "$APP_PATH/Frameworks/quickjs_engine.framework/quickjs_engine" "$APP_PATH/$BUNDLE_NAME"; do
            if [ -f "$BIN" ] && nm -gU "$BIN" 2>/dev/null | grep -q '_jsNewRuntime'; then
              FOUND="$BIN"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "❌ 找不到 jsNewRuntime 导出 —— quickjs native bridge 没链接或被 strip"
            find "$APP_PATH" -maxdepth 3 -name 'quickjs*' -print || true
            exit 1
          fi
          echo "✅ QuickJS native bridge 已链接：$FOUND"

      - name: Embed main.js + python-home（framework 由 Xcode 的 Embed Frameworks 负责）
        # 关键步骤：把 main.js 和 python-home 塞进 Runner.app bundle
        #
        # ⚠️ 这里**不再**拷 NodeMobile.xcframework / Python.xcframework：
        #    add_nodemobile.rb 已经把这两个 xcframework 登记进 target 的
        #    「Embed Frameworks」(copy_files_build_phases) ⇒ Xcode 构建时只会把
        #    **真机 slice 里那个 .framework** 拷到 Runner.app/Frameworks/，
        #    也就是运行时真正被链接/加载的 NodeMobile.framework、Python.framework。
        #    旧代码在这里又 `cp -R` 整个 xcframework ⇒ 同一个二进制在包里存两份：
        #      NodeMobile  52MB ×2、Python(含 stdlib/lib-dynload) 71MB（其中 65MB
        #      与 python-home 完全重复）—— 合计白占 117MB。
        #    iOS 运行时**从不读** *.xcframework 这个多平台包装目录：
        #      · NodeJSBridge.swift 只按框架名 NodeMobile 加载；
        #      · PythonBridge.swift 的 xcframework 兜底（candidates ② 和
        #        fwDynload）都带 fileExists 判断，删掉后自动跳过
        #        （PYTHONHOME 第一候选就是 python-home）。
        #    ⇒ 2026-10-21 用户确认删除，改为只做存在性校验（缺了直接构建失败）。
        run: |
          set -e
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          mkdir -p "$APP_PATH/Frameworks"
          # 1) 校验 Xcode embed 真的把真机 slice 的 framework 放进来了
          test -f "$APP_PATH/Frameworks/NodeMobile.framework/NodeMobile" \
            || { echo "❌ Runner.app 缺 Frameworks/NodeMobile.framework（Embed Frameworks 失效）"; exit 1; }
          test -f "$APP_PATH/Frameworks/Python.framework/Python" \
            || { echo "❌ Runner.app 缺 Frameworks/Python.framework（Embed Frameworks 失效）"; exit 1; }
          # 2) 禁止重复副本回流（加了就会让包凭空大 100MB+）
          if compgen -G "$APP_PATH/Frameworks/*.xcframework" > /dev/null; then
            echo "❌ Runner.app/Frameworks 里仍残留 *.xcframework 重复副本："
            ls -d "$APP_PATH/Frameworks/"*.xcframework
            exit 1
          fi
          # 3) main.js (NodeMobile 启动入口)
          mkdir -p "$APP_PATH/nodejs-project"
          cp assets/nodejs-project/dist/main.js   "$APP_PATH/nodejs-project/main.js"
          cp assets/nodejs-project/dist/main.js.md5 "$APP_PATH/nodejs-project/main.js.md5"
          # 4) python-home (CPython stdlib + site-packages + spider 适配层)
          if [ -d "build/python-home" ]; then
            cp -R build/python-home "$APP_PATH/python-home"
          else
            echo "❌ python-home 缺失（应已被 Build python-home 步骤产出）"
            exit 1
          fi
          echo "=== Runner.app/Frameworks ==="
          ls "$APP_PATH/Frameworks/"
          echo "=== Runner.app/nodejs-project ==="
          ls -la "$APP_PATH/nodejs-project/"
          echo "=== Runner.app/python-home ==="
          ls -la "$APP_PATH/python-home/"
          ls "$APP_PATH/python-home/lib/python3.12/" | head -20
          ls "$APP_PATH/python-home/lib/python3.12/site-packages/" | head -20

      - name: 产物体积明细（定位"为什么这么大"）
        # 纯诊断，不改变产物：把 .app 各目录 / 各 framework / 最大的文件都打出来，
        # 这样"软件为啥这么大"有数据可查，不用猜（用户 2026-10-13 问过）。
        run: |
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          echo "==== .app 总大小 ===="
          du -sh "$APP_PATH" || true
          echo "==== 一级条目（小→大）===="
          du -sh "$APP_PATH"/* 2>/dev/null | sort -h | tail -20 || true
          echo "==== Frameworks 内（小→大）===="
          du -sh "$APP_PATH"/Frameworks/* 2>/dev/null | sort -h | tail -25 || true
          echo "==== 最大的 25 个文件 ===="
          find "$APP_PATH" -type f -exec du -k {} + 2>/dev/null | sort -n | tail -25 \
            | awk '{printf "%8.2f MB  %s\n", $1/1024, $2}' || true
          echo "==== assets 里打进包的部分 ===="
          du -sh "$APP_PATH"/flutter_assets 2>/dev/null || true
          du -sh "$APP_PATH"/flutter_assets/* 2>/dev/null | sort -h | tail -15 || true

      - name: Strip original code signature
        run: |
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f  "$APP_PATH/embedded.mobileprovision"
          echo "✅ Stripped original signature"

      - name: Pseudo-sign with ldid
        # ldid -S = ad-hoc 伪签名（TrollStore 接受）
        # 主 app + 所有 framework + 所有 dylib 都要签
        # 关键：NodeMobile.framework 内的二进制也必须签
        #
        # ⚠️ 不要 `ldid -S "$APP_PATH"`：APP_PATH 是 .app 目录，ldid 要 Mach-O 二进制
        #    会报 `ldid.cpp(1455): _assert(): end >= size - 0x10`
        #    必须指到 .app 内的主可执行文件 $APP_PATH/$BUNDLE_NAME
        run: |
          set -e
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          APP_EXEC="$APP_PATH/$BUNDLE_NAME"
          echo "=== Signing main executable: $APP_EXEC ==="
          ldid -S "$APP_EXEC"
          if [ -d "$APP_PATH/Frameworks" ]; then
            for FRAMEWORK in "$APP_PATH/Frameworks/"*.framework; do
              if [ -d "$FRAMEWORK" ]; then
                FW_NAME=$(basename "$FRAMEWORK" .framework)
                FW_EXEC="$FRAMEWORK/$FW_NAME"
                if [ -f "$FW_EXEC" ]; then
                  ldid -S "$FW_EXEC"
                  echo "✅ Signed framework: $FW_NAME"
                fi
              fi
            done
            # xcframework 内部还有多 slice 子目录（ios-arm64_x86_64-simulator 等）
            # 每个子目录里的二进制也要签
            for XCFRAMEWORK in "$APP_PATH/Frameworks/"*.xcframework; do
              if [ -d "$XCFRAMEWORK" ]; then
                for SLICE in "$XCFRAMEWORK"/*/; do
                  if [ -d "$SLICE" ]; then
                    FW_NAME=$(basename "$SLICE" .framework)
                    FW_EXEC="$SLICE$FW_NAME"
                    if [ -f "$FW_EXEC" ]; then
                      ldid -S "$FW_EXEC"
                      echo "✅ Signed xcframework slice: $FW_NAME ($(basename $(dirname "$SLICE")))"
                    fi
                  fi
                done
              fi
            done
            for DYLIB in "$APP_PATH/Frameworks/"*.dylib; do
              if [ -f "$DYLIB" ]; then
                ldid -S "$DYLIB"
                echo "✅ Signed dylib: $(basename "$DYLIB")"
              fi
            done
          fi
          # python-home stdlib 里的 C 扩展（lib-dynload/*.so）也要签：
          # dlopen 未签名 .so 在部分 iOS 环境会失败 → import 这些模块时闪退
          for PYSO in "$APP_PATH"/python-home/lib/python3.12/lib-dynload/*.so; do
            if [ -f "$PYSO" ]; then
              ldid -S "$PYSO" || true
            fi
          done
          echo "✅ Signed python-home C extensions"
          for BIN in "$APP_PATH/"*.dylib "$APP_PATH/"*.so; do
            if [ -f "$BIN" ]; then
              ldid -S "$BIN"
              echo "✅ Signed: $(basename "$BIN")"
            fi
          done

      - name: Package IPA
        run: |
          set -e
          APP_PATH=${{ steps.locate.outputs.APP_PATH }}
          mkdir -p build/ipa
          TEMP_DIR=$(mktemp -d)
          mkdir -p "$TEMP_DIR/Payload"
          cp -R "$APP_PATH" "$TEMP_DIR/Payload/"
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          IPA_NAME="tvbox-ios-${SHORT_SHA}.ipa"
          cd "$TEMP_DIR"
          zip -r -q -X "$GITHUB_WORKSPACE/build/ipa/${IPA_NAME}" Payload
          cd "$GITHUB_WORKSPACE"
          rm -rf "$TEMP_DIR"
          echo "IPA_PATH=build/ipa/${IPA_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh build/ipa/
          echo "✅ IPA created: $IPA_NAME"
          echo "IPA_SIZE=$(du -h build/ipa/${IPA_NAME} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-ios-trollstore
          path: build/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload dSYM (崩溃精确定位用)
        # 崩在 KSPlayer 的 FFmpeg 核心时，.ips 里只有「函数名 + 函数内偏移」
        # （如 FFmpegAssetTrack.init(codecpar:) +1256）。有 dSYM 才能用 atos 把它
        # 精确映射回源码行，避免下一刀靠猜。拿不到也不算构建失败，不影响出包。
        #
        # ⚠️ 为什么路径要用 glob 兜住，而不是写 build/ios/iphoneos/：
        #   `flutter build ios` 会给 xcodebuild 传 `BUILD_DIR=<项目>/build/ios`
        #   （见 flutter_tools/lib/src/ios/mac.dart，非 archive 动作才传；
        #    源码注释原话 "dSYM files aren't copied to the archive if BUILD_DIR is set"）
        #   ⇒ Xcode 的产物目录 = $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)
        #     = **build/ios/Release-iphoneos/**，Runner.app 与 Runner.app.dSYM 同目录。
        #   之后 Flutter 只把 **Runner.app 这一个目录** rsync 到 build/ios/iphoneos/
        #   （mac.dart：outputDir = targetBuildDir.replaceFirst('/$configuration-', '/')，
        #    所以日志里那句 "Built build/ios/iphoneos/Runner.app" 就是这么来的），
        #   **.dSYM 不在那次 rsync 里** ⇒ build/ios/iphoneos/ 下永远不会有 dSYM。
        #   之前写死 `build/ios/iphoneos/*.dSYM`，因此长期是「步骤 success 但零产物」。
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: runner-dsym
          path: |
            build/ios/**/*.dSYM
          retention-days: 30
          if-no-files-found: warn

      - name: Dump KSPlayer 行号表 (崩溃定位, 诊断用)
        # 崩溃 .ips 只给「函数名 + 函数内偏移」（如 FFmpegAssetTrack.init +1116），
        # 拿不到源码行。这里用 atos 把该函数附近地址逐条映射成「文件:行号」贴进日志，
        # 与 .ips 的 symbolLocation 对照即可精确定位到行。纯诊断，失败不影响出包。
        if: always()
        continue-on-error: true
        run: |
          # dSYM 的真实位置随 Flutter 版本会变（原因见上面「Upload dSYM」的注释），
          # 所以这里用 find 动态定位，不要再写死 build/ios/iphoneos/。
          echo "=== build/ios 下的 dSYM ==="
          find build/ios -maxdepth 3 -name '*.dSYM' -type d 2>/dev/null || true
          DWARF=$(find build/ios -type f -path '*/Contents/Resources/DWARF/Runner' 2>/dev/null | head -1)
          if [ -z "$DWARF" ]; then echo "⚠️ 没有 dSYM，跳过"; exit 0; fi
          echo "DWARF=$DWARF"
          echo "=== dSYM uuid (应与 .ips 的 slice_uuid 一致) ==="
          xcrun dwarfdump --uuid "$DWARF" || true
          # 崩点换算（链址 = 0x100000000 + imageOffset）：
          #   imageOffset=555496(0x87A68), symbolLocation=+1116 → 函数起始 = 0x100000000+555496-1116
          FNSTART=$((0x100000000 + 555496 - 1116))
          for off in $(seq 900 4 1400); do
            ADDR=$(printf '0x%x' $((FNSTART + off)))
            printf 'OFF=+%s %s ' "$off" "$ADDR"
            xcrun atos -o "$DWARF" -arch arm64 "$ADDR" 2>/dev/null | head -1
          done

  # ── 构建记录只保留最近 10 次 ──────────────────────────────────
  # GitHub 不会自动清理旧的 workflow run / artifact：
  #   · 每次 push 都会新建一个 run，并各自上传一份同名 artifact（v4 不会覆盖）
  #   · 一次 IPA ≈ 200MB，10 次就 2GB，旧包没人下载却一直占仓库存储配额
  # 这里在构建结束后删掉第 11 次及更早的 run（删 run 会连带删掉它的产物）。
  # 当前这次 run 一定在最新的 10 个里，不会被误删。
  prune-runs:
    name: 只保留最近 10 次构建
    needs: build-ios-trollstore
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP = 10;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: 'ios.yml', per_page: 100 }
            );
            // 按创建时间从新到旧
            const sorted = runs.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );
            let deleted = 0;
            for (const r of sorted.slice(KEEP)) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner, repo, run_id: r.id,
                });
                deleted++;
                core.info(`已删除旧构建 #${r.run_number} (${r.created_at})`);
              } catch (e) {
                core.warning(`删除 #${r.run_number} 失败: ${e.message}`);
              }
            }
            core.info(
              `共 ${sorted.length} 次构建，保留最新 ${Math.min(sorted.length, KEEP)} 次，删除 ${deleted} 次`
            );
