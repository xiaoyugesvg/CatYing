<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>漫蛙动漫 WebHome</title>
    <style>
        :root {
            --panel-rgb: 76, 88, 98;
            --panel: rgba(var(--panel-rgb), 0.58);
            --panel-strong: rgba(var(--panel-rgb), 0.82);
            --line: rgba(255, 255, 255, 0.2);
            --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
            --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
            --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));
            --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
        }

        body { margin: 0; min-height: 100vh; background: transparent; color: #fff; font-family: sans-serif; -webkit-font-smoothing: antialiased; }
        html:not(.fm-native), html:not(.fm-native) body { background: #192030; }

        .header { position: sticky; top: 0; z-index: 100; background: var(--panel-strong); backdrop-filter: blur(10px); padding: calc(var(--safe-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
        .search-bar { display: flex; gap: 10px; }
        .search-input { flex: 1; background: var(--panel); border: 1px solid var(--line); color: #fff; padding: 8px 16px; border-radius: 20px; outline: none; font-size: 14px; }
        .search-input:focus { border-color: #10b981; }
        .search-btn, .ctrl-btn, .back-btn { background: #10b981; color: #fff; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; outline: none; }
        .search-btn:focus, .search-btn:hover { background: #0ea5e9; }
        
        .categories { display: flex; gap: 10px; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { padding: 6px 16px; border-radius: 16px; background: var(--panel); color: #ccc; cursor: pointer; font-size: 14px; border: 1px solid transparent; outline: none; }
        .cat-btn.active, .cat-btn:focus, .cat-btn:hover { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }

        #app { padding: 16px calc(var(--safe-right) + 16px) calc(var(--safe-bottom) + 16px) calc(var(--safe-left) + 16px); max-width: 1200px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
        
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; outline: none; transition: transform 0.2s; }
        .card:focus, .card:hover { transform: translateY(-2px) scale(1.02); background: var(--panel-strong); border-color: #10b981; }
        .card-img-wrapper { width: 100%; aspect-ratio: 3 / 4; position: relative; background: rgba(0, 0, 0, 0.3); pointer-events: none; }
        .card img { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        .card-badge { position: absolute; bottom: 4px; right: 4px; background: rgba(0, 0, 0, 0.75); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
        .card-info { padding: 10px; pointer-events: none; }
        .card-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-desc { font-size: 12px; color: #9ca3af; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .load-more { display: block; width: 200px; margin: 30px auto; padding: 12px; text-align: center; background: var(--panel); border: 1px solid var(--line); color: #fff; border-radius: 20px; cursor: pointer; outline: none; }
        .load-more:focus, .load-more:hover { background: var(--panel-strong); border-color: #10b981; }

        /* 详情页样式 */
        #detailPage { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #192030; z-index: 2000; overflow-y: auto; padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 16px); }
        .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); margin-bottom: 16px; }
        .back-btn:focus, .back-btn:hover { background: #10b981; border-color: #10b981; }
        
        .detail-top { display: flex; gap: 16px; margin-bottom: 20px; }
        .detail-cover { width: 120px; border-radius: 8px; object-fit: cover; }
        .detail-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .detail-title { font-size: 20px; font-weight: bold; color: #10b981; }
        .detail-meta { font-size: 13px; color: #9ca3af; }
        .detail-desc { font-size: 13px; color: #d1d5db; line-height: 1.5; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        
        .line-tabs { display: flex; gap: 10px; margin-bottom: 16px; overflow-x: auto; }
        .line-tab { padding: 6px 16px; background: rgba(255,255,255,0.1); border-radius: 16px; cursor: pointer; font-size: 14px; outline: none; border: 1px solid transparent; }
        .line-tab.active, .line-tab:focus, .line-tab:hover { background: #10b981; border-color: #10b981; }
        
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding-bottom: 30px; }
        .ep-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px; border-radius: 4px; text-align: center; font-size: 13px; cursor: pointer; outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-btn:focus, .ep-btn:hover { background: rgba(16, 185, 129, 0.2); border-color: #10b981; }
        .ep-btn.playing { background: #10b981; border-color: #10b981; font-weight: bold; }

        .ctrl-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .ctrl-btn:hover, .ctrl-btn:focus { background: #10b981; border-color: #10b981; }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: transparent; }
    </style>
</head>
<body>
    <div class="header">
        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="输入你想看的动漫..." readonly>
            <button id="searchBtn" class="search-btn">搜索</button>
        </div>
        <div class="categories" id="categoryTabs">
            <span class="cat-btn active" data-id="">全部</span>
            <span class="cat-btn" data-id="1">国产动漫</span>
            <span class="cat-btn" data-id="2">日韩动漫</span>
            <span class="cat-btn" data-id="3">欧美动漫</span>
            <span class="cat-btn" data-id="4">港台动漫</span>
            <span class="cat-btn" data-id="5">动漫电影</span>
            <span class="cat-btn" data-id="6">里番动漫</span>
        </div>
    </div>

    <div id="app">
        <div id="videoList" class="grid"></div>
        <button id="loadMoreBtn" class="load-more">加载中...</button>
    </div>

    <div id="detailPage"></div>

    <script>
        // --- 基础兼容引导层 ---
        (function () {
            if (window.fm || window.fongmiBridge || window.fongmi) document.documentElement.classList.add("fm-native");
            window.whenFm = () => window.fm ? Promise.resolve(window.fm) : new Promise(r => window.addEventListener("fmsdk", () => r(window.fm), { once: true }));
        })();

        // --- 简写与工具函数 ---
        const $ = (s, ctx = document) => ctx.querySelector(s);
        const $$ = (s, ctx = document) => ctx.querySelectorAll(s);
        const parseDOM = html => new DOMParser().parseFromString(html, "text/html");
        
        // 统一绑定点击和遥控器确认事件
        const bindKey = (el, fn) => {
            el.tabIndex = 0;
            el.onclick = fn;
            el.onkeydown = e => { if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); fn(e); } };
        };

        // --- 核心播放控制器 ---
        class PlayerController {
            constructor() { this.eps = []; this.idx = -1; this.timer = null; this.lastState = -1; this.lastPos = 0; }
            
            init(eps, title, pic) {
                this.eps = eps; this.title = title; this.pic = pic; this.idx = -1;
                this.stop(); this.msg("请选择集数开始播放"); this.ui();
            }

            async play(index) {
                if (index < 0 || index >= this.eps.length) return;
                this.idx = index; this.ui(); this.msg(`正在解析第 ${index + 1} 集...`);

                try {
                    let ep = this.eps[index], fm = await whenFm();
                    let res = await fm.req(ep.pageUrl, { method: "GET" });
                    let doc = parseDOM(res.body), m3u8 = "";
                    
                    let iframe = $('iframe', doc);
                    if (iframe && iframe.src.includes('url=')) m3u8 = decodeURIComponent(iframe.src.split('url=')[1].split('&')[0]);
                    
                    if (!m3u8) {
                        for (let script of $$('script', doc)) {
                            let match = script.textContent.match(/currentUrl\s*=\s*['"]([^'"]+)['"]/);
                            if (match) { m3u8 = match[1]; break; }
                        }
                    }

                    if (!m3u8) throw new Error("无法获取真实的视频地址");

                    this.msg(`正在播放: ${ep.name}`);
                    fm.play(m3u8, `${this.title} ${ep.name}`, { pic: this.pic, format: "hls" });
                    this.start();
                } catch(e) { this.msg(`播放失败: ${e.message}`); }
            }

            start() {
                this.stop(); this.lastState = -1; this.lastPos = 0;
                this.timer = setInterval(async () => {
                    let fm = await whenFm();
                    if (!fm.stat) return;
                    let stat = await fm.stat();
                    let state = stat.state || 1, pos = stat.position || 0, dur = stat.duration || 0;
                    
                    if (state === 3) {
                        this.lastState = 3;
                        if (dur > 0) this.lastPos = pos / dur;
                    } else if ((state === 1 || state === 2) && this.lastState === 3) {
                        this.lastState = -1;
                        this.lastPos > 0.95 ? this.playNext() : (this.msg("已暂停或退出播放"), this.stop());
                    }
                }, 2000);
            }

            stop() { clearInterval(this.timer); this.timer = null; }
            playNext() { this.idx < this.eps.length - 1 ? this.play(this.idx + 1) : (this.msg("已经是最后一集了"), this.stop()); }
            playPrev() { if (this.idx > 0) this.play(this.idx - 1); }
            resumeCurrent() { if (this.idx >= 0) this.play(this.idx); }
            msg(txt) { if ($('#currentPlayerStatus')) $('#currentPlayerStatus').textContent = txt; }

            ui() {
                $$('.ep-btn').forEach((b, i) => b.classList.toggle('playing', i === this.idx));
                if ($('#btnPrevEp')) $('#btnPrevEp').disabled = this.idx <= 0;
                if ($('#btnNextEp')) $('#btnNextEp').disabled = this.idx >= this.eps.length - 1 || this.idx === -1;
            }
        }
        window.playerController = new PlayerController();

        // --- 页面生命周期与交互 ---
        (async function () {
            let currentPage = 1, currentCategory = "", isLoading = false;
            let listEl = $('#videoList'), loadBtn = $('#loadMoreBtn'), header = $('.header');
            
            // 路由拦截
            window.addEventListener('popstate', e => {
                let isDetail = e.state && e.state.page === 'detail';
                $('#detailPage').style.display = isDetail ? 'block' : 'none';
                $('#app').style.display = header.style.display = isDetail ? 'none' : 'block';
                if (!isDetail) window.playerController.stop();
            });

            // 搜索绑定
            let searchInp = $('#searchInput');
            searchInp.onclick = () => searchInp.removeAttribute("readonly");
            searchInp.onblur = () => searchInp.setAttribute("readonly", "readonly");
            bindKey($('#searchBtn'), async () => {
                let kw = searchInp.value.trim();
                if (kw) (await whenFm()).search(kw, { direct: true });
            });

            // 分类绑定
            $$('.cat-btn').forEach(btn => {
                bindKey(btn, () => {
                    $$('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.id;
                    currentPage = 1; listEl.innerHTML = "";
                    fetchData();
                });
            });

            bindKey(loadBtn, fetchData);

            // --- 数据拉取与渲染 ---
            async function fetchData() {
                if (isLoading) return;
                isLoading = true; loadBtn.textContent = "加载中...";

                try {
                    let fm = await whenFm();
                    let isFirst = currentPage === 1;
                    let url = "https://manwaqu.cc" + (isFirst ? "/cate/" + (currentCategory ? "?typeid=" + currentCategory : "") : "/api/cate/");
                    
                    let options = isFirst ? { method: "GET", credentials: "include" } : {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest", "Referer": "https://manwaqu.cc/cate/" },
                        credentials: "include",
                        body: JSON.stringify({
                            page: { page: currentPage, pageSize: 36 }, category: "video", sort: 0,
                            comic: { status: -1, day: 0, year: 0, tag: "" },
                            video: { year: 0, typeId: currentCategory ? parseInt(currentCategory, 10) : 0, area: "", lang: "", status: -1 },
                            novel: { status: -1, day: 0, sortId: 0 }
                        })
                    };

                    let res = await fm.req(url, options), list = [];

                    if (isFirst) {
                        let doc = parseDOM(res.body);
                        $$(".item a", doc).forEach(el => {
                            let urlAttr = el.getAttribute("href");
                            if (!urlAttr || !urlAttr.includes("/video/")) return;
                            let img = $('.thumb_img', el), title = $('.title', el), desc = $('.desc', el), badge = $('.badge span', el);
                            list.push({
                                url: urlAttr, pic: img ? (img.dataset.src || img.src) : "",
                                title: title ? title.textContent.trim() : "",
                                intro: desc ? desc.textContent.replace(/[\n\r\|]/g, '').trim() : "",
                                tags: badge ? badge.textContent.trim() : ""
                            });
                        });
                    } else {
                        let obj = typeof res.body === "string" ? JSON.parse(res.body) : res.body;
                        list = (obj && obj.data && obj.data.list) ? obj.data.list : (Array.isArray(obj) ? obj : []);
                    }

                    if (list.length) {
                        list.forEach(item => {
                            let card = document.createElement("div");
                            card.className = "card";
                            card.innerHTML = `
                                <div class='card-img-wrapper'>
                                    <img src='${fm.res ? fm.res(item.pic) : item.pic}' loading='lazy'>
                                    ${item.tags ? `<div class='card-badge'>${item.tags}</div>` : ''}
                                </div>
                                <div class='card-info'>
                                    <div class='card-title'>${item.title}</div>
                                    <div class='card-desc'>${item.intro}</div>
                                </div>
                            `;
                            bindKey(card, () => { if (fm.preloadArtwork) fm.preloadArtwork(item.pic, ""); showDetail(item, fm); });
                            listEl.appendChild(card);
                        });
                        currentPage++;
                        loadBtn.textContent = "加载更多";
                        loadBtn.disabled = false;
                    } else {
                        loadBtn.textContent = "没有更多数据了";
                        loadBtn.disabled = true;
                    }
                } catch (e) {
                    loadBtn.textContent = `失败(${e.message || "未知错误"})点击重试`;
                } finally {
                    isLoading = false;
                }
            }

            // --- 详情页逻辑 ---
            async function showDetail(item, fm) {
                if (fm.ext && fm.ext.toast) fm.ext.toast("正在加载详情...");
                try {
                    let res = await fm.req(item.url.startsWith("http") ? item.url : "https://manwaqu.cc" + item.url, { method: "GET" });
                    let doc = parseDOM(res.body);
                    
                    let meta = { type: "动漫", dir: "未知", act: "未知", state: "未知", year: item.tags || "" };
                    $$('.comic-meta > div', doc).forEach(el => {
                        let t = el.textContent.replace(/\s+/g, ' ').trim();
                        if (t.includes("类型：")) meta.type = t.replace("类型：", "").trim() || meta.type;
                        else if (t.includes("导演：")) meta.dir = t.replace("导演：", "").trim() || meta.dir;
                        else if (t.includes("主演：")) meta.act = t.replace("主演：", "").trim() || meta.act;
                        else if (t.includes("状态：")) meta.state = t.replace("状态：", "").trim() || meta.state;
                        else if (t.includes("年份：")) meta.year = t.replace("年份：", "").trim() || meta.year;
                    });
                    
                    let descEl = $('.comic-desc', doc);
                    let content = descEl ? descEl.textContent.trim() : (item.intro || "暂无简介");

                    let lines = Array.from($$('#lineSelect option', doc)).map(o => ({ id: o.value, name: o.textContent.trim() }));
                    if (!lines.length) lines.push({ id: '0', name: '默认线路' });

                    let epsData = {}; 
                    lines.forEach((l, i) => {
                        epsData[l.id] = [];
                        let grid = $(`#grid-${l.id}`, doc) || (i === 0 ? $('.episode-grid', doc) : null);
                        if (grid) {
                            $$('a.episode-item', grid).forEach(a => {
                                let href = a.getAttribute('href');
                                epsData[l.id].push({ name: a.textContent.trim(), pageUrl: href.startsWith("http") ? href : "https://manwaqu.cc" + href });
                            });
                        }
                    });

                    $('#detailPage').innerHTML = `
                        <button class="back-btn" id="closeDetailBtn">返回主页</button>
                        <div class="detail-top">
                            <img src="${fm.res ? fm.res(item.pic) : item.pic}" class="detail-cover">
                            <div class="detail-info">
                                <div class="detail-title">${item.title}</div>
                                <div class="detail-meta">更新状态：${meta.state}</div>
                                <div class="detail-meta">分类：${meta.type} | 年份：${meta.year}</div>
                                <div class="detail-meta">主演：${meta.act}</div>
                                <div class="detail-meta">导演：${meta.dir}</div>
                            </div>
                        </div>
                        <div class="detail-desc">${content}</div>
                        
                        <div id="playerControls" style="display:none; margin-bottom:20px; background:rgba(255,255,255,0.05); padding:12px; border-radius:8px;">
                            <div style="font-size:14px; margin-bottom:10px; color:#10b981;" id="currentPlayerStatus">准备播放...</div>
                            <div style="display:flex; gap:10px;">
                                <button class="ctrl-btn" id="btnPrevEp" disabled>上一集</button>
                                <button class="ctrl-btn" id="btnPlayResume">重新播放该集</button>
                                <button class="ctrl-btn" id="btnNextEp" disabled>下一集</button>
                            </div>
                        </div>

                        <h3 style="margin: 0 0 10px 0; font-size: 16px;">选择集数</h3>
                        <div class="line-tabs" id="lineTabs">
                            ${lines.map((l, i) => `<div class="line-tab ${i===0?'active':''}" data-id="${l.id}">${l.name}</div>`).join('')}
                        </div>
                        <div id="episodesContainer"></div>
                    `;

                    history.pushState({ page: 'detail' }, '', '');
                    $('#app').style.display = header.style.display = 'none';
                    $('#detailPage').style.display = 'block';

                    bindKey($('#closeDetailBtn'), () => history.back());
                    bindKey($('#btnPrevEp'), () => window.playerController.playPrev());
                    bindKey($('#btnNextEp'), () => window.playerController.playNext());
                    bindKey($('#btnPlayResume'), () => window.playerController.resumeCurrent());

                    const renderEpisodes = lineId => {
                        let eps = epsData[lineId] || [];
                        window.playerController.init(eps, item.title, item.pic);
                        $('#episodesContainer').innerHTML = `<div class="ep-grid">${eps.map((e, i) => `<button class="ep-btn" data-idx="${i}">${e.name}</button>`).join('')}</div>`;
                        $('#playerControls').style.display = 'block';
                        
                        $$('.ep-btn').forEach(b => bindKey(b, () => window.playerController.play(parseInt(b.dataset.idx, 10))));
                    };

                    $$('.line-tab').forEach(t => bindKey(t, () => {
                        $$('.line-tab').forEach(x => x.classList.remove('active'));
                        t.classList.add('active');
                        renderEpisodes(t.dataset.id); 
                    }));

                    if (lines.length) renderEpisodes(lines[0].id);

                } catch (e) {
                    if (fm.ext && fm.ext.toast) fm.ext.toast("加载失败: " + e.message);
                }
            }

            // 初始化UI配置并获取首屏
            let fm = await whenFm();
            if (fm.ui && fm.ui.setChrome) fm.ui.setChrome({ mode: "edge", startup: true }).catch(()=>{});
            fetchData();
        })();
    </script>
</body>
</html>
