<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网页首页 · 内置示例</title>
<style>
  :root{
    --bg:#F7F5F1; --card:#FFFFFF; --line:rgba(0,0,0,.08);
    --fg:#1C1C1E; --fg2:rgba(28,28,30,.55); --accent:#C8553D;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1C1C1E; --card:#2A2A2E; --line:rgba(255,255,255,.10);
           --fg:#F5F2EC; --fg2:rgba(245,242,236,.55); --accent:#E0795F; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
       padding:14px 14px 28px;}
  h1{margin:2px 0 4px;font-size:17px;font-weight:700}
  .muted{color:var(--fg2);font-size:12px}
  .row{display:flex;gap:8px;margin-top:12px}
  select,input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;
       border:1px solid var(--line);background:var(--card);color:var(--fg);
       font-size:14px;appearance:none;-webkit-appearance:none}
  button{padding:10px 16px;border:none;border-radius:10px;background:var(--accent);
       color:#fff;font-size:14px;font-weight:600}
  button:active{opacity:.75}
  #status{margin-top:12px;font-size:12px;color:var(--fg2);min-height:18px}
  #list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  #recentWrap{display:none;margin-top:14px}
  .sec{font-size:12.5px;font-weight:600;margin-bottom:8px}
  .rail{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .rail .card{flex:0 0 88px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;cursor:pointer}
  .card:active{opacity:.7}
  .card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;
        background:var(--line)}
  .card .t{padding:6px 8px 0;font-size:12.5px;font-weight:600;
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .r{padding:1px 8px 7px;font-size:11px;color:var(--fg2);
        white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tip{margin-top:18px;padding:10px 12px;border:1px dashed var(--line);
       border-radius:10px;font-size:11.5px;color:var(--fg2)}
  code{background:var(--line);padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
  <h1>网页首页</h1>
  <div class="muted">这是内置示例页 · 右上角「⚙」可换成你自己的 HTML 地址</div>

  <div class="row">
    <select id="site"></select>
  </div>
  <div class="row">
    <input id="kw" placeholder="输入片名搜索" autocomplete="off">
    <button id="go">搜索</button>
  </div>

  <div id="recentWrap">
    <div class="sec">继续观看</div>
    <div class="rail" id="recent"></div>
  </div>

  <div id="status"></div>
  <div id="list"></div>

  <div class="tip">
    这个页面就是普通 HTML/JS，通过 <code>window.ant</code> 调猫影的能力：<br>
    <code>ant.source.list/search/detail/recent</code> 取片源数据（recent = 继续观看）·
    <code>ant.player.open</code> 用猫影播放器播放 ·
    <code>ant.storage</code> 存数据 · <code>ant.request</code> 发请求（不受 CORS 限制）·
    <code>ant.exitMiniApp</code> 退回影视首页
  </div>

<script>
  var siteKey = '';
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function setStatus(m) { $('#status').textContent = m || ''; }

  async function init() {
    if (!window.ant) { setStatus('桥接未就绪：请重新进入本页'); return; }
    try {
      var list = await ant.source.list();
      var sel = $('#site');
      sel.innerHTML = '';
      (list || []).forEach(function (s) {
        var o = document.createElement('option');
        o.value = s.key;
        o.textContent = s.name + (s.searchable === false ? '（不支持搜索）' : '');
        sel.appendChild(o);
      });
      siteKey = sel.value || '';
      sel.onchange = function () { siteKey = sel.value; };
      setStatus(list && list.length ? '共 ' + list.length + ' 个片源' : '没有可用片源，请先在影视模块配置订阅');
    } catch (e) {
      setStatus('读取片源失败：' + (e && e.message ? e.message : e));
    }
  }

  async function doSearch() {
    var wd = $('#kw').value.trim();
    if (!wd) return;
    if (!siteKey) { setStatus('请先选择一个片源'); return; }
    setStatus('搜索中…');
    try {
      var r = await ant.source.search({ siteKey: siteKey, wd: wd });
      var list = (r && r.list) ? r.list : [];
      render(list);
      setStatus('找到 ' + list.length + ' 条' + (list.length ? '，点封面直接播第一集' : ''));
    } catch (e) {
      setStatus('搜索失败：' + (e && e.message ? e.message : e));
    }
  }

  function render(list) {
    var box = $('#list');
    box.innerHTML = '';
    list.forEach(function (v) {
      var el = document.createElement('div');
      el.className = 'card';
      el.innerHTML =
        '<img src="' + esc(v.vod_pic || '') + '" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="t">' + esc(v.vod_name) + '</div>' +
        '<div class="r">' + esc(v.vod_remarks) + '</div>';
      el.onclick = function () { playFirst(v); };
      box.appendChild(el);
    });
  }

  function firstPlayUrl(s) {
    if (!s) return '';
    var seg = String(s).split('$$$')[0];      // 取第一条线路
    var first = seg.split('#')[0];            // 第一集
    var i = first.indexOf('$');               // 「名称$地址」
    return i >= 0 ? first.slice(i + 1) : first;
  }

  async function playFirst(v) {
    setStatus('解析中…');
    try {
      var d = await ant.source.detail({ siteKey: siteKey, id: v.vod_id });
      var url = firstPlayUrl(d && d.vod_play_url);
      if (!url) { setStatus('这个片源没给播放地址，换一个源试试'); return; }
      await ant.player.open({ url: url, title: v.vod_name || '' });
      setStatus('已交给猫影播放器');
    } catch (e) {
      setStatus('播放失败：' + (e && e.message ? e.message : e));
    }
  }

  // 继续观看：直接读猫影的最近播放记录（ant.source.recent，带进度）
  async function initRecent() {
    try {
      var r = await ant.source.recent({ limit: 12 });
      var list = (r && r.list) ? r.list : [];
      if (!list.length) return;
      var rail = $('#recent');
      list.forEach(function (v) {
        var el = document.createElement('div');
        el.className = 'card';
        var sub = (v.episodeIndex != null)
          ? ('第' + (v.episodeIndex + 1) + '集')
          : (v.vod_remarks || '');
        el.innerHTML =
          '<img src="' + esc(v.vod_pic || '') + '" onerror="this.style.visibility=\'hidden\'">' +
          '<div class="t">' + esc(v.vod_name) + '</div>' +
          '<div class="r">' + esc(sub) + '</div>';
        el.onclick = function () { playRecent(v); };
        rail.appendChild(el);
      });
      $('#recentWrap').style.display = 'block';
    } catch (e) {
      // 没有记录 / 调用失败都不打扰用户
    }
  }

  async function playRecent(v) {
    if (!v.sourceKey) { setStatus('这条记录缺少片源信息'); return; }
    siteKey = v.sourceKey;
    setStatus('解析中…');
    try {
      var d = await ant.source.detail({ siteKey: v.sourceKey, id: v.vod_id });
      var url = firstPlayUrl(d && d.vod_play_url);
      if (!url) { setStatus('这个片源没给播放地址'); return; }
      await ant.player.open({ url: url, title: v.vod_name || '' });
      setStatus('已交给猫影播放器');
    } catch (e) {
      setStatus('播放失败：' + (e && e.message ? e.message : e));
    }
  }

  $('#go').onclick = doSearch;
  $('#kw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  init().then(initRecent);
</script>
</body>
</html>
