<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>详情</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <!-- 内置播放器 -->
  <div class="detail-player" id="detail-player">
    <video id="detail-video" controls playsinline webkit-playsinline x5-video-player-type="h5" x5-video-player-fullscreen="false"></video>
    <div class="detail-player-placeholder" id="player-placeholder">
      <div class="placeholder-icon">▶</div>
      <div class="placeholder-text">选择集数开始播放</div>
    </div>
    <div class="detail-player-loading" id="player-loading" style="display:none">加载中…</div>
    <!-- 渲染模式按钮 -->
    <button class="detail-render-btn" id="render-btn" title="渲染模式">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span id="render-label">适配</span>
    </button>
  </div>

  <!-- 返回按钮 -->
  <button data-focus class="detail-back" id="detail-back">‹</button>

  <main class="detail-main">
    <div id="detail-box"></div>
    <div id="ep-box"></div>
  </main>

  <script src="lib.js"></script>
  <script src="hls.min.js"></script>
  <script>
  (function () {
    'use strict';
    var U = window.EmbyUI;
    var box = document.getElementById('detail-box');
    var epBox = document.getElementById('ep-box');
    var video = document.getElementById('detail-video');
    var placeholder = document.getElementById('player-placeholder');
    var playerLoading = document.getElementById('player-loading');

    var state = { site: null, vod: null, lines: [], lineIndex: 0, last: null, playing: { lineIdx: -1, epIdx: -1, retryCount: 0 } };
    var playerType = 'internal'; // 播放器类型：internal / ant
    ant.storage.get('player-type', 'internal').then(function (t) { playerType = t || 'internal'; }).catch(function () {});

    document.getElementById('detail-back').addEventListener('click', function () {
      try { video.pause(); } catch (e) {}
      ant.navigateBack();
    });

    /* ---------- 内置播放 ---------- */
    var progressTimer = null;

    function saveProgressNow() {
      if (!video || !video.src) return;
      if (state.playing.lineIdx < 0 || state.playing.epIdx < 0) return;
      var line = state.lines[state.playing.lineIdx];
      var ep = line.episodes[state.playing.epIdx];
      if (!line || !ep) return;
      var siteKey = state.site && state.site.key ? state.site.key : '';
      var vodId = state.vod && state.vod.vod_id ? String(state.vod.vod_id) : '';
      U.updatePlayProgress(siteKey, vodId, line.name, ep.name, ep.id, Math.floor(video.currentTime), Math.floor(video.duration || 0)).catch(function () {});
    }

    function startProgressSaver() {
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = setInterval(saveProgressNow, 10000);
    }

    function stopProgressSaver() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    }

    var hls = null;
    var playTimeout = null;
    var currentPlayUrl = '';

    /* 用蚂蚁播放器打开（内置播放失败时的兜底） */
    function openAntPlayer(url, title) {
      if (!url) return;
      ant.player.open({ url: url, title: title || '播放' }).then(function () {
        U.toast('已调起蚂蚁播放器');
      }).catch(function (e) {
        U.toast('蚂蚁播放器调用失败：' + U.errText(e));
      });
    }

    /* 清除播放超时 */
    function clearPlayTimeout() {
      if (playTimeout) { clearTimeout(playTimeout); playTimeout = null; }
    }

    function playInApp(url, title) {
      currentPlayUrl = url;
      placeholder.style.display = 'none';
      playerLoading.style.display = 'block';
      stopProgressSaver();
      clearPlayTimeout();
      // 销毁之前的hls实例
      if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
      try { video.pause(); } catch (e) {}
      video.onerror = null;

      // 放宽m3u8检测：url里包含m3u8就算（不仅是后缀）
      var isM3u8 = /m3u8/i.test(url);
      // 检测是否是常见视频格式
      var isDirectVideo = /\.(mp4|m3u8|flv|ts|webm|mov|avi|mkv)(\?|$)/i.test(url);
      var siteKey = state.site && state.site.key ? state.site.key : '';
      var vodId = state.vod && state.vod.vod_id ? String(state.vod.vod_id) : '';
      var line = state.playing.lineIdx >= 0 ? state.lines[state.playing.lineIdx] : null;
      var ep = line && state.playing.epIdx >= 0 ? line.episodes[state.playing.epIdx] : null;

      function tryResume() {
        if (!siteKey || !vodId || !line || !ep) return;
        U.getPlayProgress(siteKey, vodId).then(function (prog) {
          if (prog && prog.epId === ep.id && prog.position > 5 && prog.duration > 0) {
            var ratio = prog.position / prog.duration;
            if (ratio < 0.95) {
              var mins = Math.floor(prog.position / 60);
              var secs = prog.position % 60;
              U.toast('继续播放：' + mins + ':' + (secs < 10 ? '0' : '') + secs);
              video.addEventListener('loadedmetadata', function onMeta() {
                try { video.currentTime = prog.position; } catch (e) {}
                video.removeEventListener('loadedmetadata', onMeta);
              });
            }
          }
        }).catch(function () {});
      }

      // 15秒播放超时：还没playing就提示并提供蚂蚁播放器选项
      playTimeout = setTimeout(function () {
        if (video.paused && !video.currentTime) {
          playerLoading.style.display = 'none';
          showPlayFail(url, title);
        }
      }, 15000);

      if (isM3u8 && window.Hls && Hls.isSupported()) {
        hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, lowLatencyMode: true });
        hls.xhrSetup = function (xhr) {
          try {
            xhr.setRequestHeader('User-Agent', 'Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36');
            xhr.setRequestHeader('Referer', url);
            xhr.setRequestHeader('Origin', url);
          } catch (e) {}
        };
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          tryResume();
          video.play().catch(function () {});
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            clearPlayTimeout();
            playerLoading.style.display = 'none';
            showPlayFail(url, title);
          }
        });
      } else {
        video.src = url;
        video.load();
        tryResume();
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      }
      startProgressSaver();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* 播放失败界面：提示+蚂蚁播放器按钮 */
    function showPlayFail(url, title) {
      clearPlayTimeout();
      placeholder.style.display = 'flex';
      placeholder.innerHTML =
        '<div class="placeholder-icon" style="font-size:36px;opacity:0.4">⚠️</div>' +
        '<div class="placeholder-text" style="margin-bottom:12px">内置播放失败，试试蚂蚁播放器</div>' +
        '<button id="ant-player-btn" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:18px;font-size:13px;cursor:pointer">📺 用蚂蚁播放器打开</button>';
      var btn = document.getElementById('ant-player-btn');
      if (btn) btn.addEventListener('click', function () { openAntPlayer(url, title); });
    }

    video.addEventListener('playing', function () {
      clearPlayTimeout();
      playerLoading.style.display = 'none';
      state.playing.retryCount = 0;
    });
    video.addEventListener('waiting', function () { playerLoading.style.display = 'block'; });
    video.addEventListener('error', function () {
      clearPlayTimeout();
      playerLoading.style.display = 'none';
      // 自动切换线路重试（最多试3条线路）
      if (state.playing.lineIdx >= 0 && state.playing.epIdx >= 0) {
        var nextLineIdx = state.playing.lineIdx + 1;
        if (nextLineIdx < state.lines.length && state.playing.retryCount < 3) {
          state.playing.retryCount++;
          var nextLine = state.lines[nextLineIdx];
          var nextEp = nextLine.episodes[state.playing.epIdx];
          if (nextEp) {
            U.toast('线路' + state.lines[state.playing.lineIdx].name + '失败，切换到' + nextLine.name);
            state.lineIndex = nextLineIdx;
            paintEpisodes();
            playEpisode(nextLine, nextEp);
            return;
          }
        }
      }
      showPlayFail(currentPlayUrl, state.vod && state.vod.vod_name || '播放');
    });

    /* ---------- 渲染模式切换 ---------- */
    var renderModes = [
      { name: '适配', fit: 'contain' },
      { name: '拉伸', fit: 'fill' },
      { name: '裁剪', fit: 'cover' }
    ];
    var renderIdx = 0;
    var renderBtn = document.getElementById('render-btn');
    var renderLabel = document.getElementById('render-label');
    if (renderBtn) {
      renderBtn.addEventListener('click', function () {
        renderIdx = (renderIdx + 1) % renderModes.length;
        var mode = renderModes[renderIdx];
        video.style.objectFit = mode.fit;
        if (renderLabel) renderLabel.textContent = mode.name;
        U.toast('渲染模式：' + mode.name);
      });
    }

    // 自动播放下一集
    video.addEventListener('ended', function () {
      saveProgressNow();
      stopProgressSaver();
      if (state.playing.lineIdx < 0 || state.playing.epIdx < 0) return;
      var line = state.lines[state.playing.lineIdx];
      if (!line || !line.episodes) return;
      var nextIdx = state.playing.epIdx + 1;
      if (nextIdx < line.episodes.length) {
        var nextEp = line.episodes[nextIdx];
        U.toast('自动播放下一集：' + nextEp.name);
        playEpisode(line, nextEp);
      } else {
        U.toast('已播放到最后一集');
      }
    });

    // 页面离开时保存进度
    window.addEventListener('beforeunload', function () {
      saveProgressNow();
      stopProgressSaver();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) saveProgressNow();
    });

    function playEpisode(line, episode) {
      var site = state.site;
      var title = (state.vod.vod_name || '播放') + ' · ' + episode.name;
      // 记录当前播放的线路和集数索引
      var lineIdx = state.lines.indexOf(line);
      var epIdx = line && line.episodes ? line.episodes.indexOf(episode) : -1;
      if (lineIdx >= 0) state.playing.lineIdx = lineIdx;
      if (epIdx >= 0) state.playing.epIdx = epIdx;

      U.apiPlay(site, line.name, episode.id).then(function (info) {
        var url = info && info.url ? info.url : '';
        var needSniff = info && (String(info.parse) === '1' || String(info.jx) === '1');
        if (!url && /^https?:/i.test(episode.id)) url = episode.id;
        if (!url) { U.toast('没有拿到可播放地址'); return; }

        // 根据播放器设置选择播放方式
        if (playerType === 'ant') {
          // 蚂蚁播放器：全部调起宿主原生播放器
          ant.player.open({ url: url, title: title }).catch(function () {
            // 蚂蚁播放器失败时回退到内置
            U.toast('蚂蚁播放器调用失败，回退内置播放');
            playInApp(url, title);
          });
        } else if (needSniff) {
          // 内置播放器模式下，需要解析的线路还是得用蚂蚁播放器
          ant.player.open({ url: url, title: title }).catch(function () {});
        } else {
          // 内置播放器：页内播放
          playInApp(url, title);
        }
        var siteKey = site && site.key ? site.key : '';
        U.setLastEp(siteKey, String(state.vod.vod_id), {
          line: line.name, name: episode.name, id: episode.id, at: Date.now()
        }).catch(function () {});
      }).catch(function (e) {
        U.toast('播放失败：' + U.errText(e));
      });
    }

    /* ---------- 详情渲染 ---------- */
    function skeletonHead() {
      return '<div class="detail-skeleton"><div class="sk sk-poster"></div><div class="sk sk-line w70"></div><div class="sk sk-line w40"></div><div class="sk sk-line w90"></div></div>';
    }
    function skeletonEpisodes() {
      return '<div class="ep-skeleton">' + Array(6).fill('<div class="sk sk-ep"></div>').join('') + '</div>';
    }

    function paintHead(vod, last) {
      var pic = vod.vod_pic || '';
      var name = vod.vod_name || '';
      var remarks = vod.vod_remarks || '';
      var year = vod.vod_year || '';
      var area = vod.vod_area || '';
      var type = vod.vod_type || '';
      var director = vod.vod_director || '';
      var actor = vod.vod_actor || '';
      var content = (vod.vod_content || '').replace(/<[^>]+>/g, '').trim();
      var meta = [year, area, type].filter(Boolean).join(' / ');

      box.innerHTML =
        '<div class="detail-head">' +
          (pic ? '<img class="detail-poster" src="' + U.esc(pic) + '" alt="" />' : '<div class="detail-poster ph">' + U.esc(name.charAt(0) || '?') + '</div>') +
          '<div class="detail-meta">' +
            '<h1 class="detail-name">' + U.esc(name) + '</h1>' +
            (remarks ? '<span class="detail-remarks">' + U.esc(remarks) + '</span>' : '') +
            (meta ? '<div class="detail-sub">' + U.esc(meta) + '</div>' : '') +
            (director ? '<div class="detail-sub">导演：' + U.esc(director) + '</div>' : '') +
            (actor ? '<div class="detail-sub">主演：' + U.esc(actor) + '</div>' : '') +
          '</div>' +
        '</div>' +
        (content ? '<div class="detail-desc">' + U.esc(content) + '</div>' : '');
    }

    function paintEpisodes() {
      if (!state.lines.length) { epBox.innerHTML = '<div class="hint" style="padding:24px 0">没有可播放的线路</div>'; return; }
      var line = state.lines[state.lineIndex];
      var episodes = line.episodes || [];
      epBox.innerHTML =
        '<div class="ep-lines">' +
          state.lines.map(function (l, i) {
            return '<button data-focus class="ep-line ' + (i === state.lineIndex ? 'on' : '') + '" data-idx="' + i + '">' + U.esc(l.name) + '</button>';
          }).join('') +
        '</div>' +
        '<div class="ep-grid">' +
          episodes.map(function (ep, i) {
            var isLast = state.last && state.last.line === line.name && state.last.name === ep.name;
            return '<button data-focus class="ep-item' + (isLast ? ' last' : '') + '" data-idx="' + i + '">' + U.esc(ep.name) + '</button>';
          }).join('') +
        '</div>';

      epBox.querySelectorAll('.ep-line').forEach(function (node) {
        node.addEventListener('click', function () {
          state.lineIndex = Number(node.dataset.idx);
          paintEpisodes();
        });
      });
      epBox.querySelectorAll('.ep-item').forEach(function (node) {
        node.addEventListener('click', function () {
          var idx = Number(node.dataset.idx);
          playEpisode(line, episodes[idx]);
        });
      });
    }

    function load(site, id, summary) {
      state.site = site;
      if (summary) paintHead(summary, null); else box.innerHTML = skeletonHead();
      epBox.innerHTML = skeletonEpisodes();

      U.apiDetail(site, id).then(function (full) {
        var vod = full && full.vod_name ? full : (summary || {});
        state.vod = vod;
        state.lines = U.parseLines(full && full.vod_play_url ? full : vod);
        var siteKey = site && site.key ? site.key : '';
        U.getLastEp(siteKey, String(vod.vod_id || id)).then(function (last) {
          state.last = last;
          if (last) {
            for (var i = 0; i < state.lines.length; i++) {
              if (state.lines[i].name === last.line) { state.lineIndex = i; break; }
            }
          }
          paintHead(vod, last);
          paintEpisodes();
          U.pushHistory(siteKey, vod).catch(function () {});
          // 自动播放：有续播记录继续播，没有就从第一集开始
          var autoLine = state.lines[state.lineIndex];
          var autoEp = null;
          if (last && autoLine) {
            autoEp = autoLine.episodes.find(function (e) { return e.name === last.name; });
          }
          if (!autoEp && autoLine && autoLine.episodes && autoLine.episodes.length) {
            autoEp = autoLine.episodes[0];
          }
          if (autoLine && autoEp) setTimeout(function () { playEpisode(autoLine, autoEp); }, 500);
        });
      }).catch(function (e) {
        box.innerHTML = U.stateHtml('⚠️', '详情加载失败', U.esc(U.errText(e)));
        epBox.innerHTML = '';
      });
    }

    // 加载主题
    ant.storage.get('ui-theme', 'dark').then(function (t) {
      if (t && t !== 'dark') document.documentElement.setAttribute('data-theme', t);
    }).catch(function () {});

    U.boot({ active: '' }).then(function (ok) {
      if (!ok) return;
      var id = U.qs('id');
      ant.storage.getJSON('nav.detail', null).then(function (nav) {
        var navSiteKey = nav && nav.siteKey;
        var site = (navSiteKey && window.App.sites.find(function (s) { return s.key === navSiteKey; })) || window.App.site;
        var summary = nav && nav.vod ? nav.vod : null;
        var target = id || (summary && summary.vod_id);
        if (!target) {
          box.innerHTML = U.stateHtml('🤔', '没有指定条目', '回首页挑一个吧。');
          return;
        }
        if (summary && String(summary.vod_id) !== String(target)) summary = null;
        load(site, target, summary);
      });
    });
  })();
  </script>
</body>
</html>
