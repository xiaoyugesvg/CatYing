name: tvbox
description: 跨平台 TVBox 视频播放器（iOS 巨魔 / Android / Windows）。基于 Flutter + Node.js 远程源 + media_kit 视频播放。
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  hive_ce: ^2.19.3
  path_provider: ^2.1.5
  cached_network_image_ce: ^4.7.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  # 直播系统内核（iOS = AVPlayer，对应 tvbox-Swift 直播 system 内核）。
  # mpv 对部分 HLS/TS 直播流黑屏（有声音无画面），AVPlayer 可正常解码，
  # 故直播页 iOS 使用 video_player 播放，其余平台仍走 media_kit(mpv)。
  video_player: ^2.9.2
  screen_brightness: ^0.2.2
  connectivity_plus: 6.1.5  # 7.x 用了 iOS 26 SDK 的 API（NWPath.isUltraConstrained），macos-14 runner 是 Xcode 15-16 编译不过
  window_manager: ^0.4.0
  # url_launcher 已废弃：配置中心改用应用内 webview_flutter 替代
  # flutter_smart_dialog 已移除（A1）：全项目 **0 处引用**，且它是**纯 Dart 包**
  # （无 iOS podspec、.flutter-plugins-dependencies 命中 0），删掉不影响 iOS 工程。
  # 弹窗统一用 Flutter 原生的 showDialog / showModalBottomSheet。
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  crypto: ^3.0.6
  archive: ^3.6.1
  # 全屏状态栏显示电量（battery_plus 跨平台支持 iOS/Android/Windows/macOS/Linux）
  battery_plus: ^6.2.1
  # 自定义背景上传 - 从相册选择图片 (image_picker)
  image_picker: ^1.1.2
  # 投屏（DLNA/UPnP 设备发现 + 视频推送）
  # 参考 PiliPlus-main/lib/pages/dlna/view.dart 接入方式
  # iOS 端需要 NSLocalNetworkUsageDescription + NSBonjourServices = [_ssdp._udp]
  # 已在 ios/Runner/Info.plist 配置
  dlna_dart: ^0.1.0
  # 应用内 WebView（用于配置中心 URL，替代 url_launcher 跳外部浏览器）
  webview_flutter: ^4.10.0
  gbk_codec: ^0.4.0
  html: ^0.15.7
  scrollable_positioned_list: ^0.3.8
  photo_view: ^0.15.0
  permission_handler: ^13.0.2
  file_picker: ^13.1.0
  flutter_pdfview: ^1.4.5
  bonsoir: ^7.1.5
  flutter_foreground_task: ^11.0.3
  url_launcher: ^6.3.2
  encrypt: ^5.0.3
  flutter_cache_manager: ^3.4.5
  flutter_staggered_grid_view: ^0.7.0
  # ── 书源规则引擎（阅读模块）需要的三个包 ────────────────────────
  #
  # 🔴 这三个包**代码里一直在用，但 pubspec 里没有** → `lib` 里
  #    29 个编译错误（`Target of URI doesn't exist` + 连带的名字未定义）。
  #    用法：
  #      · `xpath_selector` + `xpath_selector_html_parser`
  #        → `reading/novel_source/analyze/analyze_xpath.dart`（真 XPath 规则）
  #          和 `analyze_jsoup.dart`（Jsoup 规则：`HtmlNodeTree` 等）
  #      · `fast_gbk` → `reading/novel_source/analyze/analyze_url.dart`
  #        （GBK 参数编解码：`gbk.encode` / `gbk.decode`）
  #
  # ⚠️ 三个都是**纯 Dart 包**（已核对：包内没有 ios/android/macos 等
  #    原生平台目录，也不依赖任何原生插件）→ 符合 TrollStore
  #    "不新增原生插件"的约束，不需要 pod install。
  #
  # ⚠️ 版本按**本机 pub 缓存里已有的**写，离线也能装上：
  #    `fast_gbk-1.0.0` / `xpath_selector-3.0.2` /
  #    `xpath_selector_html_parser-3.0.1`
  #    （后两个的传递依赖 `expressions-0.2.5+3` 也在缓存里）
  xpath_selector: ^3.0.2
  xpath_selector_html_parser: ^3.0.1
  fast_gbk: ^1.0.0
  # [NEXHUB-移植] 书源引擎 XML 导入/解析（shuyuan_source_service / analyze_xpath）
  xml: ^6.5.0
  # [PATCH-5] 同步 HTTP：java.ajax 的同步抓取用（纯 Dart，无原生插件）
  sync_http: ^0.3.0
  # cached_network_image 3.3.1 已移除（A2）：它与 cached_network_image_ce
  # 是**两条平行的完整实现**（各带 platform_interface / web 子包），
  # 同时编译进 App 且各自维护磁盘缓存 → 同一个网络图在影视和音乐会存两份。
  # 现已全项目统一到 `cached_network_image_ce`（更新、用 hive_ce 做缓存索引、
  # 有 HTTP 拦截器），共享缓存见 lib/widgets/app_image_cache.dart。
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 禁用 Swift Package Manager：media_kit_libs_ios_video / media_kit_video
  # 不支持 SPM（Flutter 3.44 起 SPM 默认接管依赖，会导致 iOS 构建硬失败），
  # 走 CocoaPods 兼容路径（Podfile 一直正常 pod install）。
  config:
    enable-swift-package-manager: false
  assets:
    - assets/nodejs-project/dist/
    - assets/nodejs-project/src/
    - assets/nodejs-project/src/spider/
    - assets/nodejs-project/src/spider/video/
    - assets/nodejs-project/src/spider/book/
    - assets/nodejs-project/src/spider/pan/
    - assets/nodejs-project/src/util/
    # Node.js 运行时的版本元信息（不内嵌 node.exe，启动时按需下载）
    - assets/nodejs-runtime/version.json
    # 猫爪（猫咪）Logo：用于接口配置引导页主视觉
    - assets/images/
    # 出厂内置漫画源（15 个官方源明文，装上即有源；文档目录 sources.json 云端覆盖层优先）
    - assets/config/
    # ── 🔴 出厂内置**音乐源**（之前漏声明 → 从没打进包）───────────────
    #
    # 用户 2026 要求：「这些源全部要加进去」（MusicFree 官方索引里的 50 个）。
    #
    # 原来这一条**不存在**：
    #   · `assets/music/lx/`          10 个洛雪源
    #   · `assets/music/musicfree/`   50 个 MusicFree 插件 + `.index.json`
    # 两者都只在磁盘上、**从未被 pubspec 声明** →
    # `rootBundle.loadString('assets/music/…')` 在**真机/发布包**里必然失败 →
    # 而 `BuiltinSourcesService._loadMusicFreeSources()` 里
    # `catch (_) { script = null; }` 把它**静默吞掉**
    #（这就是为什么"内置源加载失败"一直没被发现）。
    #
    # ⚠️ 目录式声明**要带结尾 `/`**，Flutter 会递归收录该目录下所有文件。
    #    这样以后往这两个目录里加源，**不用再改 pubspec**。
    - assets/music/
    - assets/music/lx/
    - assets/music/musicfree/

dependency_overrides:
  media_kit_libs_windows_video:
    path: .local_plugins/media_kit_libs_windows_video
  # [PATCH-5] 书源 JS 引擎：vendor 到本地以便打补丁
  # （文件头说明见 packages/quickjs_engine/VENDOR.md）
  quickjs_engine:
    path: packages/quickjs_engine
